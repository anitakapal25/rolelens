server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API: same-origin proxy to the backend container.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        client_max_body_size 6m;          # uploads are capped at 5 MB by the API

        # Server-Sent Events: stream tokens as they arrive, never buffer the answer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Single-page app: unknown paths fall back to index.html; hashed assets cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
    }
}
